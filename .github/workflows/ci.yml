name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  trust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p simple-httptap-proxy-tokio
      - name: httptap trust, with sudo asked for by httptap itself
        run: ./target/debug/httptap trust
      # Ubuntu's runners restrict unprivileged user namespaces, so httptap runs under sudo, and the program it
      # starts runs as the runner's user again.
      - name: Intercepted HTTPS with nothing but the system's trust
        run: |
          sudo --preserve-env=HOME,XDG_DATA_HOME ./target/debug/httptap \
            sh -c 'test "$(id -u)" = "'"$(id -u)"'" && curl -sS --fail -o /dev/null https://example.com' > tap.jsonl 2> tap.err
          cat tap.err
          ! grep -q "not trusted" tap.err
          jq -e 'select(.event == "opened" and .tls and .transport == "tcp")' tap.jsonl
          jq -e 'select(.event == "response" and (.headers | map(.[0]) | index(":status")))' tap.jsonl
      - name: HTTPS decrypted with curl's own key log, its bytes untouched
        run: |
          sudo --preserve-env=HOME,XDG_DATA_HOME SSLKEYLOGFILE="$RUNNER_TEMP/keys.log" ./target/debug/httptap \
            curl -sS --fail --http1.1 -o /dev/null https://example.com > tap.jsonl 2> tap.err
          cat tap.err
          grep -q "passes untouched" tap.err
          jq -e 'select(.event == "request" and (.start_line | startswith("GET / HTTP/1.1")))' tap.jsonl
          jq -e 'select(.event == "response" and (.start_line | startswith("HTTP/1.1 200")))' tap.jsonl
