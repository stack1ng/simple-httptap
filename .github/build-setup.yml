# Steps dist runs before each release build. On macOS they build httptap.app, sign it with Developer ID, notarize
# it, and have the macOS httptap binaries carry it, so httptap installs its own network extension.
- name: Import the Developer ID certificate into a throwaway keychain
  if: runner.os == 'macOS'
  env:
    MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
  run: |
    keychain="$RUNNER_TEMP/signing.keychain-db"
    password=$(openssl rand -hex 16)
    echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
    security create-keychain -p "$password" "$keychain"
    security set-keychain-settings -lut 21600 "$keychain"
    security unlock-keychain -p "$password" "$keychain"
    security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
    rm "$RUNNER_TEMP/certificate.p12"
    security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
    security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
- name: Build, sign and notarize httptap.app
  if: runner.os == 'macOS'
  env:
    APPLE_ID: ${{ secrets.APPLE_ID }}
    APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  run: |
    crates/redirector/implementation/macos/extension/build-app.sh "$RUNNER_TEMP/httptap-app.zip"
    echo "HTTPTAP_REDIRECTOR_APP_ZIP=$RUNNER_TEMP/httptap-app.zip" >> "$GITHUB_ENV"
