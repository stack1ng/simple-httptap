[package]
name = "simple-httptap-redirector-windows"
version = "0.0.3"
edition = "2024"

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[dependencies]
simple-httptap-redirector = { version = "0.0.3", path = "../.." }
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[dev-dependencies]
simple-httptap-redirector-conformance = { path = "../../conformance" }

[lints]
workspace = true
