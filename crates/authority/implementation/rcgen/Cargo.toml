[package]
name = "simple-httptap-authority-rcgen"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[lints]
workspace = true

[dependencies]
pem = "4.0.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
simple-httptap-authority = { version = "0.1.0", path = "../.." }
tempfile = "3.27.0"
time = "0.3.55"
url = "2.5.9"

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
simple-httptap-authority-conformance = { path = "../../conformance" }
tempfile = "3.27.0"
