[package]
name = "simple-httptap-proxy-tokio"
version = "0.0.3"
edition = "2024"
publish = false
description = "Runs a program with its traffic sent through a SOCKS5 proxy that decrypts TLS and QUIC with a key log and writes every request and response, byte-exact, to stdout as NDJSON."
repository = "https://github.com/stack1ng/simple-httptap"
license = "MIT"

[lib]
path = "implementation.rs"

[[bin]]
name = "httptap"
path = "main.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
futures-util = "0.3.34"
percent-encoding = "2.3.2"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls-platform-verifier = "0.7.1"
simple-httptap-authority = { version = "0.0.3", path = "../../../authority" }
simple-httptap-authority-rcgen = { version = "0.0.3", path = "../../../authority/implementation/rcgen" }
simple-httptap-decoder = { version = "0.0.3", path = "../../../decoder" }
simple-httptap-decoder-http1 = { version = "0.0.3", path = "../../../decoder/implementation/http1" }
simple-httptap-decoder-http2 = { version = "0.0.3", path = "../../../decoder/implementation/http2" }
simple-httptap-decoder-http3 = { version = "0.0.3", path = "../../../decoder/implementation/http3" }
simple-httptap-decrypter = { version = "0.0.3", path = "../../../decrypter" }
simple-httptap-decrypter-quic = { version = "0.0.3", path = "../../../decrypter/implementation/quic" }
simple-httptap-decrypter-tls = { version = "0.0.3", path = "../../../decrypter/implementation/tls" }
simple-httptap-keylog = { version = "0.0.3", path = "../../../keylog" }
simple-httptap-keylog-file = { version = "0.0.3", path = "../../../keylog/implementation/file" }
simple-httptap-proxy = { version = "0.0.3", path = "../.." }
simple-httptap-redirector = { version = "0.0.3", path = "../../../redirector" }
simple-httptap-redirector-linux = { version = "0.0.3", path = "../../../redirector/implementation/linux" }
simple-httptap-redirector-macos = { version = "0.0.3", path = "../../../redirector/implementation/macos" }
simple-httptap-redirector-windows = { version = "0.0.3", path = "../../../redirector/implementation/windows" }
simple-httptap-sink = { version = "0.0.3", path = "../../../sink" }
simple-httptap-sink-ndjson = { version = "0.0.3", path = "../../../sink/implementation/ndjson" }
simple-httptap-trust = { version = "0.0.3", path = "../../../trust" }
simple-httptap-trust-system = { version = "0.0.3", path = "../../../trust/implementation/system" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.9"

[dev-dependencies]
simple-httptap-proxy-conformance = { path = "../../conformance" }
tempfile = "3.27.0"

[package.metadata.dist]
dist = true
formula = "simple-httptap"
