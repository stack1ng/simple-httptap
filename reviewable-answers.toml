[hook-form]
question = "An event hook is named as given in the state. What form is the verb in the name?"
subject = "name"

[hook-form.choices]
present_participle = "The verb is a present participle, such as starting or accessing."
past_participle = "The verb is a past participle, such as ended or written."
neither = "Neither: the name has no participle."

[hook-form.answers]

[summary-information]
question = "A Rust item's kind, its name, the line that declares it, and the first paragraph of its documentation are given in the state. Does the paragraph tell a reader something that the name and the declaration do not already say? A link to outside documentation counts as telling something."
subject = "kind\tname\tdeclaration\tparagraph"

[summary-information.choices]
adds_information = "The paragraph states a fact, a condition, a unit, an effect, a limit or a relation to something else that cannot be read off the name and the declaration, or it links to outside documentation."
restates_name = "The paragraph only says again what the name and the declaration already say, in other words, and links to nothing."

