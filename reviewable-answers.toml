# Answers a decision model gave about the names and doc comment summaries in this workspace.
# `cargo reviewable check` asks only for what it has no answer for, and removes what the code no
# longer has. Commit this file.
# To dispute a wrong answer, add `disputed = "why, in one line"` to its line. The owner may write
# `corrected = "<one of the choices>"` instead, which stands in for the model's answer.

[function-summary]
question = "The first sentence of the documentation of a Rust function is given in the state. What form is the verb it starts with?"
subject = "summary"

[function-summary.choices]
third_person_verb = 'A verb in the third person singular present, such as "Returns" or "Creates".'
imperative_verb = 'A verb in the imperative or base form, such as "Return" or "Create".'
other = 'It does not start with a verb: a noun phrase, or a sentence with its own subject such as "This function returns ...".'

